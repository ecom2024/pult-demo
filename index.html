<title>Управленческий пульт — демо</title><style>
:root{--bg:#0f1115;--s1:#16181d;--s2:#1c1f26;--ink:#f5f6f7;--ink2:#a9adb6;--muted:#7b808b;
--grid:#252932;--line:#2e3340;--border:rgba(255,255,255,.08);
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;
--k1:#3987e5;--k2:#199e70;--k3:#c98500;--k4:#8b7bd8;--k5:#c2427a;--k6:#0f9fb0;
--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--demo:#8b7bd8;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5f3;--s1:#fcfcfb;--s2:#f0efec;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
--grid:#e6e5df;--line:#dedcd4;--border:rgba(11,11,11,.10);
--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--demo:#5a4bbd;color-scheme:light}
*{box-sizing:border-box}
/* иначе карточка с длинным числом распирает сетку и страница едет вбок */
.grid>*{min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased}
/* Когда пульт открыт значком с экрана «Домой», страница занимает весь экран,
   включая полосу с часами и вырез камеры. Отступы ниже держат содержимое в
   безопасной зоне; на устройствах без выреза все env(...) равны нулю. */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);
 background:var(--bg);z-index:40;pointer-events:none}
.wrap{max-width:min(1900px,95vw);margin:0 auto;
 padding:calc(22px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right))
         calc(70px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left))}
@media(max-width:700px){
 .wrap{padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(50px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
 h1{font-size:19px} .sub{font-size:12px}
 .card,.chart{padding:13px 14px;border-radius:11px}
 .v{font-size:21px;letter-spacing:-.4px} .v small{font-size:12px;margin-left:2px} .k{font-size:10px;letter-spacing:.3px;margin-bottom:5px}
 .d{font-size:11.5px} .grid{gap:9px}
 button,select{padding:9px 13px;font-size:13px} input[type=date]{padding:8px 9px;font-size:13px}
 .seg button{padding:9px 12px}
 h2{margin:22px 0 9px;font-size:11px}
 .sig{padding:11px 13px} .sig b{font-size:12.5px} .sig span{font-size:12px}
 table{font-size:12px} td,th{padding:5px 4px}
 .bar{padding:8px 0 10px}
 .need-t{font-size:11px}
 footer{font-size:11px}
}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:max(0px, calc(14px - env(safe-area-inset-top)))}
h1{font-size:22px;margin:0 0 3px;letter-spacing:-.3px;font-weight:680}
.sub{color:var(--ink2);font-size:12.5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{background:var(--s1);border:1px solid var(--border);color:var(--ink2);border-radius:9px;
 padding:7px 12px;cursor:pointer;font:inherit;font-size:12.5px;white-space:nowrap;transition:.12s}
button:hover{border-color:var(--muted);color:var(--ink)}
button.on{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:620}
button.ghost.on{background:var(--demo);border-color:var(--demo)}
input[type=date]{background:var(--s1);border:1px solid var(--border);color:var(--ink);border-radius:9px;padding:6px 9px;font:inherit;font-size:12.5px}
.bar{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .row+.row{margin-top:8px}
.bar .row[hidden],.cmpBox[hidden]{display:none!important}
.lb{font-size:12.5px;color:var(--muted);padding:0 2px}
button.cmp{background:transparent;border-style:dashed}
button.cmp.on{background:var(--s2);border-style:solid;border-color:var(--c1);color:var(--ink)}
.cmpNow{font-size:12px;color:var(--muted)}
.cmpBox{padding:9px 11px;background:var(--s1);border:1px solid var(--border);border-radius:10px}
.cmpBox .seg button{padding:6px 11px;font-size:12px}
.seg.sm button{padding:6px 10px;font-size:12px}
.lb.gl{margin-left:6px}
@media(max-width:700px){.lb.gl{width:100%;margin:2px 0 0}.seg.sm{width:100%}.seg.sm button{flex:1 1 0;padding:8px 3px}}

 .bar .nav2{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px}

 .cmpBox #bgo{grid-column:1/-1}

}
.seg{flex:0 0 auto}
@media(max-width:700px){
 .bar .seg{width:100%} .bar .seg button{flex:1 1 0;padding:9px 4px;font-size:12.5px}

 .bar .nav #last{grid-column:1/-1}
 .bar .nav input[type=date]{width:100%}
}
.seg{display:flex;background:var(--s1);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 14px}
.seg button.on{background:var(--c1);color:#fff}
h2{font-size:12px;margin:26px 0 11px;font-weight:640;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}

.card{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:15px 17px;position:relative}
.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;font-weight:560}
.v{font-size:29px;font-weight:660;letter-spacing:-.8px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}

 display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'>';color:var(--muted);font:600 11px/1 system-ui}
details.fold[open]>summary::before{content:'v'}
details.fold>summary span{color:var(--muted);font-weight:400;font-size:11.5px}
.foldb{padding:2px 0 15px}
.foldb .chart{background:transparent;border:0;padding:0 0 4px}
.card.clk,.chart.clk{cursor:pointer}
.card.clk:hover,.chart.clk:hover{border-color:var(--muted)}
.chart{position:relative}
.card .zoom,.chart .zoom{position:absolute;right:13px;top:13px;font:600 10.5px/1 system-ui;color:var(--muted);
 opacity:0;transition:opacity .12s;pointer-events:none;letter-spacing:.3px}
.card.clk:hover .zoom,.chart.clk:hover .zoom{opacity:1}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-start;
 justify-content:center;overflow:auto;
 padding:calc(24px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.mdl[hidden]{display:none}
.mdw{background:var(--s1);border:1px solid var(--border);border-radius:15px;width:min(1020px,100%);
 padding:18px 20px 16px;position:relative;max-height:100%;display:flex;flex-direction:column}
.mdh{flex:0 0 auto}
.mdb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;

.mdb::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--s1)}

.pseg{display:flex;align-items:center;gap:8px;padding:6px 0 12px;flex:0 0 auto}
@media(max-width:700px){.pseg{padding:8px 0 10px}.pseg .seg{flex:1 1 auto}}
/* пропущенные: сигнал и заметка открывают список, строки подкрашены по тому, что сделали */
.sig.clk,.note.clk{cursor:pointer}
.sig.clk:hover,.note.clk:hover{border-color:var(--muted)}
.lnk{color:var(--c1);font-weight:600}
.misr td.st,.misi .st{font-weight:600}
.misr.bad td.st,.misi.bad .st{color:var(--crit)}
.misr.warn td.st,.misi.warn .st{color:var(--warn)}
.misr.ok td.st,.misi.ok .st{color:var(--good)}
.misr.chs td,.misi.chs{color:var(--muted)} .misr.chs td.st,.misi.chs .st{color:var(--muted);font-weight:500} .misi.chs{border-left-color:var(--line)}
.mdw table.misT td{vertical-align:top}

.knopki{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.knopki button{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:620}
@media(max-width:700px){.kopir textarea{font-size:12px;white-space:pre-wrap}.knopki button{flex:1 1 auto;padding:11px}}
@media(max-width:680px){
 .mdl{padding:calc(10px + env(safe-area-inset-top)) 6px calc(10px + env(safe-area-inset-bottom))}
 .mdw{padding:14px 12px 16px}
 .mdw .x{right:6px;top:6px;padding:8px 12px;font-size:24px}
 .mdw h3{font-size:16px;padding-right:44px}
 .mdw table th{font-size:9.5px;letter-spacing:0;padding:5px 3px;white-space:nowrap}
.vyb{display:flex;flex-wrap:wrap;gap:7px 13px;padding:2px 2px 12px;align-items:center}

 .mdw table td{padding:6px 3px}
}
.spark{margin-top:9px;height:34px}

.mdw table th:first-child,.mdw table td:first-child{text-align:left}

// периода наверху: «Неделя» — недели, «Квартал» — кварталы, остальное — месяцы;
// внутри окна её можно сменить. Периоды, начавшиеся до первой собранной смены,
// неполные и в график не берутся.
const PG={w:'неделям',m:'месяцам',q:'кварталам'};

const PG4={w:'к прошлой неделе',m:'к прошлому месяцу',q:'к прошлому кварталу'};
function perOf(s,g){ // календарный период, в который попадает смена s
 const y=+s.slice(0,4),mo=+s.slice(5,7)-1;
 if(g==='w'){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));
  const st=d.toISOString().slice(0,10);d.setUTCDate(d.getUTCDate()+6);const en=d.toISOString().slice(0,10);
  return {key:st,start:st,end:en,lab:st.slice(8)+'.'+st.slice(5,7),full:'неделя с '+dfy(st)}}
 if(g==='q'){const q=Math.floor(mo/3),m1=q*3;
  const st=new Date(Date.UTC(y,m1,1)).toISOString().slice(0,10),en=new Date(Date.UTC(y,m1+3,0)).toISOString().slice(0,10);
  return {key:y+'-'+(q+1),start:st,end:en,lab:(q+1)+' кв. '+String(y).slice(2),full:(q+1)+'-й квартал '+y}}
 const m=s.slice(0,7);
 return {key:m,start:m+'-01',end:m+'-'+String(dimOf(m)).padStart(2,'0'),lab:MS[mo]+' '+String(y).slice(2),full:MNN[mo]+' '+y}}
function planRows(arr,g,b){
 const out=[];let cur=null;
 for(let i=0;i<=b;i++){const p=perOf(SH[i],g);
  if(!cur||cur.key!==p.key){cur=Object.assign({i0:i,i1:i},p);out.push(cur)}else cur.i1=i}
 const rows=out.filter(x=>SH[x.i0]===x.start).map(x=>{
  const r={lab:x.lab,full:x.full,i0:x.i0,i1:x.i1,v:sum(arr,x.i0,x.i1),plan:null,rest:0};
  if(x.i1===b&&SH[b]<x.end){const F=fcastPer(arr,x.i0,b,x.end);r.plan=F.f;r.rest=F.rest;r.lvl=F.lvl}
  return r});
 return rows.slice(-(g==='w'?16:(g==='m'?24:12)))}

  const smenT=r=>{const s=r.i1-r.i0+1;return `${s} из ${s+r.rest} ${plural(s+r.rest,'смены','смен','смен')}`};
  barChart(host,{rows,k:'v',color:it.sc||'var(--c1)',planColor:'var(--c2)',fmtY,h:M()?260:300,
   title:`${it.k} по ${PG[g]} · последние ${rows.length}`,

          :`все показанные периоды закрыты, план совпадает с фактом`,

  // на телефоне единица уходит в шапку, иначе четыре столбца не помещаются

   +rows.slice().reverse().map(r=>{const j=rows.indexOf(r), pr=j>0?rows[j-1].v:null, cur=r.plan!=null?r.plan:r.v;
     return `<tr><td style="white-space:nowrap">${M()?r.lab:r.full}</td><td class="num">${fmtY(r.v)}${edT}${(r.plan!=null&&!M())?`<span class="mut" style="font-weight:500"> · ${smenT(r)}</span>`:''}</td>
      <td class="num">${r.plan!=null?fmtY(r.plan)+edT:'<span class="mut">—</span>'}</td><td class="num">${chip(delta(cur,pr))}</td></tr>`}).join('')

// ---------- пропущенные звонки: список и готовый текст для оператора ----------
// Данные — D.misList за последние смены (pult_data.py): смена, время, линия,
// исход у АТС, четыре последние цифры номера, заказов у клиента до звонка,
// дата последнего заказа, карточка МойСклада, перезвон (минуты, дозвонились),
// заказал ли сам за 12 часов, звонил ли по вчерашнему заказу, ЧС, сколько
// секунд длился вызов, кто положил трубку, скрыт ли номер, вид пропуска.
// Полных номеров на странице нет (правило 5): оператор открывает карточку по
// ссылке или ищет по четырём цифрам.
//
// Вид пропуска (поле 16, считает pult_data.py по длительности и тому, кто
// положил трубку): 0 — «ждал»: клиент ждал дольше SBROS секунд и не дождался,
// это единственная настоящая потеря; 1 — «сброс»: положил трубку сам в первые
// SBROS секунд — столько ждать бесполезно даже при свободных операторах: их
// телефоны начинают звонить на 7-й секунде, а половина отвеченных звонков
// получает ответ только после 10-й; такой клиент обычно набирает снова;
// 2 — «отказ»: АТС отклонила вызов, так она поступает с номерами из чёрного
// списка. Сбросы и отказы в «не дождались», перезвоны и сигналы не входят.
const ISHOD=['АТС ответила, разговора не было','сбой соединения','не ответили','другое'];
const ISHODK=['без разговора','сбой','без ответа','другое'];
const SBROS=D.sbrosSek||7;
const KART='https://online.moysklad.ru/app/#company/edit?id=';
const ddmm=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'';
function misRows(a,b){
 return (D.misList||[]).filter(r=>r[0]>=a&&r[0]<=b).map(r=>{
  const [i,hm,kan,rez,hv,nz,posl,kid,cbMin,cbOk,posle,nak,chs,dur,who,anon]=r; const vid=r[16]||0, pred=(r[17]==null)?-1:r[17];
  // календарная дата звонка: час 08 и позже — это ещё предыдущий день
  const d=new Date(SH[i]+'T00:00:00Z'); if(+hm.slice(0,2)>=8)d.setUTCDate(d.getUTCDate()-1);
  const dt=d.toISOString().slice(0,10);
  const sek=(dur!=null&&dur>=0)?dur:-1;
  let st,cls,sr,ats;
  if(vid===1){
   // быстрый сброс: не потеря, вниз серым, в текст не идёт
   ats=sek<0?'сбросил сам':`положил через ${sek} с`;
   st=`сбросил сам за первые ${SBROS} с — не потеря`+(posle?' · заказал сам':(cbOk?' · перезвонили, дозвонились':''));cls='chs';sr=5}
  else if(vid===2){
   // отказ АТС: чёрный список, вниз серым, в текст не идёт
   ats='отклонила АТС';st='отклонила АТС — чёрный список';cls='chs';sr=6}
  else{
   if(posle){st='заказал сам';cls='ok';sr=2}
   else if(cbOk){st='перезвонили через '+cbMin+' мин, дозвонились';cls='ok';sr=2}
   // разговор был незадолго ДО звонка (например, оператор сам набрал его минуту
   // назад, клиент перезвонил и не дождался) — контакт не потерян
   else if(pred>=0){st=`говорили за ${pred} мин до звонка`+(nak?' · по своему заказу':'');cls='ok';sr=2}
   else if(cbMin>=0){st='перезвонили через '+cbMin+' мин, не дозвонились';cls='warn';sr=1}
   else {st='не перезвонили'+(nak?' · звонил по своему заказу от '+ddmm(posl):'');cls='bad';sr=0}
   // чёрный список: строка остаётся в списке (внизу, серым), но в текст для
   // оператора не идёт — такому клиенту не перезванивают
   if(chs){sr=sr<2?3:4;cls='chs';st+=' · чёрный список'}
   // скрытый номер: перезвонить некуда — тоже вниз и не в текст
   else if(anon&&sr<2){sr=3;cls='chs';st+=' · номер скрыт, перезвонить нельзя'}
   // что видела АТС: сколько человек ждал и кто положил трубку (есть у звонков,
   // выгруженных с 07.09; у прежних — только исход)
   ats=sek<0?ISHODK[rez]:(rez===1?`сбой через ${sek} с`:(rez===2?`без ответа ${sek} с`:
    (who===0?`ждал ${sek} с, положил сам`:(who===1?`ждал ${sek} с, сбросила АТС`:`ждал ${sek} с`))))}
  const kl=nz?`${nf(nz)} ${plural(nz,'заказ','заказа','заказов')}, последний ${ddmm(posl)}`:'заказов не было';
  return {i,dt,hm,kan,rez,hv,nz,posl,kid,cbMin,cbOk,posle,nak,chs:!!chs,anon:!!anon,dur:sek,who,vid,pred,ats,st,cls,sr,kl}})}
function skopirovat(txt,ta,btn){
 const bylo=btn.textContent;
 const gotovo=()=>{btn.textContent='Скопировано';setTimeout(()=>btn.textContent=bylo,1800)};
 // запасной путь для Safari на телефоне: выделяем текст, дальше «Копировать» из системного меню
 const vydelit=()=>{ta.focus();ta.select();try{ta.setSelectionRange(0,txt.length)}catch(e){}

 if(D.kanalyV&&D.kanalyV.length){

 // ---------- разбор по операторам ----------
 if(D.mesta&&D.mesta.length){
  const W=D.mesta.length;
  const am=cols(D.appMesto,W,a,b), cm=cols(D.convMesto,W,a,b),
        em=cols(D.expMesto,W,a,b),
        om=cols(D.ordOp,W,a,b), vm=cols(D.revOp,W,a,b);
  const sA=am.reduce((s,x)=>s+x,0), sC=cm.reduce((s,x)=>s+x,0), sE=em.reduce((s,x)=>s+x,0)/100;

  const MALO=Math.max(10,days*2);          // меньше — процент шумит, ставим прочерк
  const sred=sA?sC/sA*100:0;
  const R=D.mesta.map((l,i)=>({l,v:am[i],n:om[i],rev:vm[i],
    c:am[i]>=MALO?cm[i]/am[i]*100:null,

    chek:om[i]?vm[i]/om[i]:0})).filter(r=>r.v>0||r.n>0);
  if(R.length){
   const F=fold(A,'Разбор по операторам',
    `${nf(sA)} ${plural(sA,'обращение','обращения','обращений')} за период · кто первым поднял трубку`);
   const nz=R.filter(r=>r.c!=null&&r.l.indexOf('Оператор')===0);

   const ah=cols(D.appHour,D.hours.length,a,b), rh=cols(D.rezervHour,D.hours.length,a,b),

   const chas=D.hours.map((l,i)=>({l,v:ah[i],r:rh[i],n:nh[i],

   const hudCh=chas.filter(x=>x.v>=Math.max(20,days*2)).slice().sort((x,y)=>y.mimo-x.mimo)[0];
   let t='';
   if(nz.length>1&&luch&&hud&&luch!==hud)
    t+=`Разброс между операторами небольшой: лучше всех <b>${luch.l}</b> — ${pf(luch.c,1)}% при ожидаемых ${pf(luch.e,1)}%, слабее всех <b>${hud.l}</b> — ${pf(hud.c,1)}% при ${pf(hud.e,1)}%. `;
   const zR=rez&&rez.c!=null?poteri(rez):0, zN=nik?poteri(nik):0;

   if(luchChek) t+=`По деньгам впереди <b>${luchChek.l}</b> — ${nf(Math.round(luchChek.chek))} ₽ средний чек. `;
   t+=`<b>Две нижние строки — не операторы, а ситуации.</b> «Резервная очередь» — звонки, ушедшие на личные мобильные сотрудников, когда все линии заняты; человек там тот же, но работать ему нечем. «Никто не ответил» — обращения, где ни один звонок не дошёл до живого человека: чаще всего клиент бросил трубку, не дождавшись ответа. `;
   if(zR+zN>0) t+=`Вместе они стоят примерно ${nf(zR+zN)} ${plural(zR+zN,'заказ','заказа','заказов')} и ${money((zR+zN)*gpo)} ₽ валовой прибыли за период. `;

const idxOf=v=>{let i=SH.findIndex(s=>s>=v);return i<0?N-1:i};
const clampD=el=>{el.min=SH[0];el.max=SH[N-1];return el};
function setMode(m){MODE=m;
 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 document.getElementById('navShift').hidden=(m==='range');
 document.getElementById('navRange').hidden=(m!=='range');
 document.getElementById('dp').value=SH[END];
 document.getElementById('ra').value=SH[RA];document.getElementById('rb').value=SH[RB];
 syncCmp();render()}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));

 document.querySelectorAll('#grans button').forEach(x=>x.classList.toggle('on',x.dataset.g===GRAN));render()});
document.getElementById('prev').onclick=()=>{END=Math.max(LEN[MODE]-1,END-LEN[MODE]);document.getElementById('dp').value=SH[END];render()};
document.getElementById('next').onclick=()=>{END=Math.min(N-1,END+LEN[MODE]);document.getElementById('dp').value=SH[END];render()};
document.getElementById('last').onclick=()=>{END=N-1;document.getElementById('dp').value=SH[END];render()};

dp.onchange=()=>{END=Math.max(LEN[MODE]-1,idxOf(dp.value));dp.value=SH[END];render()};

ra.value=SH[RA];rb.value=SH[RB];

 if(RA>RB){const t=RA;RA=RB;RB=t}ra.value=SH[RA];rb.value=SH[RB];render()};

document.querySelectorAll('#cmpModes button').forEach(b=>b.onclick=()=>{
 CMP=b.dataset.c;
 document.querySelectorAll('#cmpModes button').forEach(x=>x.classList.toggle('on',x.dataset.c===CMP));
 if(CMP==='manual'&&(BA==null||BB==null)){const [a,b2]=win();const w=yoyWin(a,b2)||prevWin(a,b2);

 ba.value=BA!=null?SH[BA]:'';bb.value=BB!=null?SH[BB]:'';

 CMP='manual';document.querySelectorAll('#cmpModes button').forEach(x=>x.classList.toggle('on',x.dataset.c==='manual'));
 ba.value=SH[BA];bb.value=SH[BB];syncCmp();render()};

   : `${dfy(SH[B.a])} — ${dfy(SH[B.b])}`);
 cmpNow.textContent = CMP==='auto' ? '' : ('база: '+shortB);
 cmpT.textContent = CMP==='auto' ? 'Сравнить с другим периодом' : 'Сравнение настроено';
 if(CMP!=='auto')cmpT.classList.add('on')}
