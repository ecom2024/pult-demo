<title>Управленческий пульт — демо</title><style>
:root{--bg:#0f1115;--s1:#16181d;--s2:#1c1f26;--ink:#f5f6f7;--ink2:#a9adb6;--muted:#7b808b;
--grid:#252932;--line:#2e3340;--border:rgba(255,255,255,.08);
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;
--k1:#3987e5;--k2:#199e70;--k3:#c98500;--k4:#8b7bd8;--k5:#c2427a;--k6:#0f9fb0;
--good:#0ca30c;--warn:#fab219;--serious:#ec835a;--crit:#d03b3b;--demo:#8b7bd8;color-scheme:dark}
:root[data-theme=light]{--bg:#f4f5f3;--s1:#fcfcfb;--s2:#f0efec;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
--grid:#e6e5df;--line:#dedcd4;--border:rgba(11,11,11,.10);
--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--demo:#5a4bbd;color-scheme:light}
*{box-sizing:border-box}
/* иначе карточка с длинным числом распирает сетку и страница едет вбок */
.grid>*{min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased}
/* Когда пульт открыт значком с экрана «Домой», страница занимает весь экран,
   включая полосу с часами и вырез камеры. Отступы ниже держат содержимое в
   безопасной зоне; на устройствах без выреза все env(...) равны нулю. */
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);
 background:var(--bg);z-index:40;pointer-events:none}
.wrap{max-width:min(1900px,95vw);margin:0 auto;
 padding:calc(22px + env(safe-area-inset-top)) calc(22px + env(safe-area-inset-right))
         calc(70px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left))}
@media(max-width:700px){
 .wrap{padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(50px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
 h1{font-size:19px} .sub{font-size:12px}
 .card,.chart{padding:13px 14px;border-radius:11px}
 .v{font-size:21px;letter-spacing:-.4px} .v small{font-size:12px;margin-left:2px} .k{font-size:10px;letter-spacing:.3px;margin-bottom:5px}
 .d{font-size:11.5px} .grid{gap:9px}
 button,select{padding:9px 13px;font-size:13px} input[type=date]{padding:8px 9px;font-size:13px}
 .seg button{padding:9px 12px}
 h2{margin:22px 0 9px;font-size:11px}
 .sig{padding:11px 13px} .sig b{font-size:12.5px} .sig span{font-size:12px}
 table{font-size:12px} td,th{padding:5px 4px}
 .bar{padding:calc(8px + env(safe-area-inset-top)) 0 8px}
 .need-t{font-size:11px}
 footer{font-size:11px}
}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:max(0px, calc(14px - env(safe-area-inset-top)))}
h1{font-size:22px;margin:0 0 3px;letter-spacing:-.3px;font-weight:680}
.sub{color:var(--ink2);font-size:12.5px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{background:var(--s1);border:1px solid var(--border);color:var(--ink2);border-radius:9px;
 padding:7px 12px;cursor:pointer;font:inherit;font-size:12.5px;white-space:nowrap;transition:.12s}
button:hover{border-color:var(--muted);color:var(--ink)}
button.on{background:var(--c1);border-color:var(--c1);color:#fff;font-weight:620}
button.ghost.on{background:var(--demo);border-color:var(--demo)}
input[type=date]{background:var(--s1);border:1px solid var(--border);color:var(--ink);border-radius:9px;padding:6px 9px;font:inherit;font-size:12.5px}
.bar{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.bar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .row+.row{margin-top:8px}
.bar .row[hidden],.cmpBox[hidden]{display:none!important}
.lb{font-size:12.5px;color:var(--muted);padding:0 2px}
button.cmp{background:transparent;border-style:dashed}
button.cmp.on{background:var(--s2);border-style:solid;border-color:var(--c1);color:var(--ink)}
.cmpNow{font-size:12px;color:var(--muted)}
.cmpBox{padding:9px 11px;background:var(--s1);border:1px solid var(--border);border-radius:10px}
.cmpBox .seg button{padding:6px 11px;font-size:12px}
.seg.sm button{padding:6px 10px;font-size:12px}
.lb.gl{margin-left:6px}
@media(max-width:700px){.lb.gl{width:100%;margin:2px 0 0}.seg.sm{width:100%}.seg.sm button{flex:1 1 0;padding:8px 3px}}
@media(max-width:700px){
 .bar .nav2{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px}
 .bar .nav2 #rgo{grid-column:1/-1}
 .cmpBox{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px}
 .cmpBox .seg{grid-column:1/-1;width:100%} .cmpBox .seg button{flex:1 1 0;padding:8px 3px}
 .cmpBox #bgo{grid-column:1/-1}
 .cmpNow{width:100%}
}
.seg{flex:0 0 auto}
@media(max-width:700px){
 .bar .seg{width:100%} .bar .seg button{flex:1 1 0;padding:9px 4px;font-size:12.5px}
 .bar .nav{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
 .bar .nav #last{grid-column:1/-1}
 .bar .nav input[type=date]{width:100%}
}
.seg{display:flex;background:var(--s1);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:7px 14px}
.seg button.on{background:var(--c1);color:#fff}
h2{font-size:12px;margin:26px 0 11px;font-weight:640;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
@media(max-width:1100px){.g5,.g4,.g23{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.g5,.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2,.g23{grid-template-columns:1fr}}
@media(max-width:430px){.g5,.g4,.g3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:15px 17px;position:relative}
.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:7px;font-weight:560}
.v{font-size:29px;font-weight:660;letter-spacing:-.8px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.v small{font-size:14px;font-weight:400;color:var(--ink2);margin-left:3px;letter-spacing:0}
.d{font-size:12px;margin-top:6px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:620;font-variant-numeric:tabular-nums}
.chip.up{background:rgba(12,163,12,.16);color:var(--good)}
.chip.dn{background:rgba(208,59,59,.16);color:var(--crit)}
.chip.fl{background:var(--s2);color:var(--muted)}
.mut{color:var(--muted)}
details.fold{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:0 17px;margin-top:12px}
details.fold>summary{cursor:pointer;padding:14px 0;font-size:13px;font-weight:620;list-style:none;
 display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'>';color:var(--muted);font:600 11px/1 system-ui}
details.fold[open]>summary::before{content:'v'}
details.fold>summary span{color:var(--muted);font-weight:400;font-size:11.5px}
.foldb{padding:2px 0 15px}
.foldb .chart{background:transparent;border:0;padding:0 0 4px}
.card.clk,.chart.clk{cursor:pointer}
.card.clk:hover,.chart.clk:hover{border-color:var(--muted)}
.chart{position:relative}
.card .zoom,.chart .zoom{position:absolute;right:13px;top:13px;font:600 10.5px/1 system-ui;color:var(--muted);
 opacity:0;transition:opacity .12s;pointer-events:none;letter-spacing:.3px}
.card.clk:hover .zoom,.chart.clk:hover .zoom{opacity:1}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-start;
 justify-content:center;overflow:auto;
 padding:calc(24px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.mdl[hidden]{display:none}
.mdw{background:var(--s1);border:1px solid var(--border);border-radius:15px;width:min(1020px,100%);
 padding:18px 20px 16px;position:relative;max-height:100%;display:flex;flex-direction:column}
.mdh{flex:0 0 auto}
.mdb{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
 padding-right:8px;margin-right:-8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.mdb::-webkit-scrollbar{width:10px}
.mdb::-webkit-scrollbar-track{background:transparent}
.mdb::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--s1)}
.mdw .x{position:absolute;right:11px;top:9px;cursor:pointer;color:var(--muted);font:400 21px/1 system-ui;
 padding:5px 9px;border-radius:8px;user-select:none}
.mdw .x:hover{color:var(--ink);background:var(--s2)}
.mdw h3{font-size:17px;font-weight:660;margin:0 0 3px;padding-right:36px}
.mdw .chart{background:transparent;border:0;padding:0}
.mdw table{margin-top:6px}
@media(max-width:680px){
 .mdl{padding:calc(10px + env(safe-area-inset-top)) 6px calc(10px + env(safe-area-inset-bottom))}
 .mdw{padding:14px 12px 16px}
 .mdw .x{right:6px;top:6px;padding:8px 12px;font-size:24px}
 .mdw h3{font-size:16px;padding-right:44px}
 .mdw table th{font-size:9.5px;letter-spacing:0;padding:5px 3px;white-space:nowrap}
 .mdw table td{padding:6px 3px}
}
.spark{margin-top:9px;height:34px}
.sig{display:flex;gap:11px;align-items:flex-start;background:var(--s1);border:1px solid var(--border);
 border-left:3px solid var(--warn);border-radius:11px;padding:12px 15px}
.sig.crit{border-left-color:var(--crit)}.sig.good{border-left-color:var(--good)}
.sig b{display:block;font-size:13px;font-weight:640;margin-bottom:2px}
.sig span{font-size:12.5px;color:var(--ink2);line-height:1.45}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);margin-top:5px;flex:0 0 9px}
.sig.crit .dot{background:var(--crit)}.sig.good .dot{background:var(--good)}
.chart{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:15px 17px 10px}
.ii{display:inline-flex;width:15px;height:15px;min-width:15px;border-radius:50%;border:1px solid var(--muted);
 color:var(--muted);font:600 10px/1 system-ui;align-items:center;justify-content:center;cursor:pointer;
 margin-left:6px;vertical-align:middle;user-select:none;text-transform:none;letter-spacing:0}
.ii:hover{border-color:var(--ink);color:var(--ink)}
.pop{display:none;margin:8px 0 2px;padding:9px 11px;border-radius:9px;background:var(--s2);
 border:1px solid var(--line);font:400 12px/1.5 system-ui;color:var(--ink2);text-transform:none;letter-spacing:0}
.pop.on{display:block}
.chart table th{font:600 10.5px/1 system-ui;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
 text-align:right;padding:0 0 7px 12px;white-space:nowrap}
table td.num{text-align:right;font-weight:620;white-space:nowrap}
table td.dim{color:var(--ink2);font-weight:500}
.mdw table th:first-child,.mdw table td:first-child{text-align:left}
/* на телефоне столбцов больше, чем помещается: убираем полоску и распускаем
   заголовки по строкам, иначе третий столбец уезжает за край экрана */
@media(max-width:680px){
 .chart table td:nth-child(2),.chart table th:nth-child(2){display:none}
 .chart table th{white-space:normal;padding-left:8px;font-size:10px;letter-spacing:.2px}
 .chart table td:first-child{width:auto}
}
.ct{font-size:13px;font-weight:620;margin-bottom:2px}
.cs{font-size:11.5px;color:var(--muted);margin-bottom:11px}
svg{display:block;width:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--muted);font-weight:500;padding:5px 7px;border-bottom:1px solid var(--grid);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
th:first-child,td:first-child{text-align:left}
td{padding:6px 7px;border-bottom:1px solid var(--grid)}
tr:last-child td{border-bottom:none}
.hb{height:7px;border-radius:4px;display:inline-block;vertical-align:middle;background:var(--c1)}
.locked{border-style:dashed;border-color:var(--line);background:transparent}
.locked .v,.locked .k{color:var(--muted)}
.badge{position:absolute;top:11px;right:12px;font-size:9.5px;font-weight:720;letter-spacing:1px;
 padding:3px 7px;border-radius:5px;background:rgba(139,123,216,.18);color:var(--demo)}
.badge.need{background:var(--s2);color:var(--muted)}
.need-t{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.note{font-size:12.5px;color:var(--ink2);background:var(--s1);border:1px solid var(--border);
 border-left:3px solid var(--c1);border-radius:10px;padding:11px 15px;margin-top:12px;line-height:1.55}
.note b{color:var(--ink)}
.tip{position:fixed;pointer-events:none;background:var(--s2);border:1px solid var(--border);border-radius:9px;
 padding:8px 11px;font-size:12px;box-shadow:0 8px 28px rgba(0,0,0,.4);opacity:0;transition:opacity .1s;z-index:300;white-space:nowrap}
.tip.wide{white-space:normal;width:360px;max-width:88vw;line-height:1.55;padding:11px 13px;color:var(--ink2)}
.tip.wide b{color:var(--ink)}
.card.big .v{font-size:38px;letter-spacing:-1.2px}
.card.big{background:var(--s2)}
@media(max-width:680px){.card.big .v{font-size:30px}}
footer{margin-top:40px;font-size:11.5px;color:var(--muted);line-height:1.75;border-top:1px solid var(--line);padding-top:16px}
.lg{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:0 0 9px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
</style></head><body><div class="wrap">
<div style="background:rgba(139,123,216,.13);border:1px solid rgba(139,123,216,.45);color:var(--demo);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:13px;line-height:1.45">Демонстрационная версия. Все цифры изменены и не отражают реальные показатели компании.</div>
<header><div><h1>Управленческий пульт</h1>
<div class="sub" id="per">—</div><div class="pop" id="popPer"></div></div>
<div class="tools"><button id="demo" class="ghost">Показать демо-числа</button><button id="tg">Светлая тема</button></div></header>
<div class="bar">
 <div class="row"><div class="seg" id="modes">
  <button data-m="day" class="on">День</button><button data-m="week">Неделя</button>
  <button data-m="month">Месяц</button><button data-m="quarter">Квартал</button>
  <button data-m="range">Свои даты</button></div></div>
 <div class="row nav" id="navShift"><button id="prev">←</button><input type="date" id="dp"><button id="next">→</button>
  <button id="last">Последняя смена</button></div>
 <div class="row nav2" id="navRange" hidden><span class="lb">с</span><input type="date" id="ra">
  <span class="lb">по</span><input type="date" id="rb"><button id="rgo">Показать</button></div>
 <div class="row"><button id="cmpT" class="cmp">Сравнить с другим периодом</button>
  <span class="lb gl">График по</span>
  <div class="seg sm" id="grans"><button data-g="auto" class="on">авто</button><button data-g="d">дням</button>
   <button data-g="w">неделям</button><button data-g="m">месяцам</button></div>
  <span class="cmpNow" id="cmpNow"></span></div>

 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));

 document.getElementById('dp').value=SH[END];

ra.value=SH[RA];rb.value=SH[RB];

 if(RA>RB){const t=RA;RA=RB;RB=t}ra.value=SH[RA];rb.value=SH[RB];render()};

<script>
/* Заглушка над закреплённой панелью.
   На некоторых телефонах панель прилипает не вплотную к верху экрана, и в
   оставшейся щели видно, как листается страница. Гадать, почему так, смысла
   нет: меряем, где панель оказалась на самом деле, и закрываем всё выше неё. */
(function(){
 var bar=document.querySelector('.bar'); if(!bar)return;
 var kr=document.createElement('div');
 kr.style.cssText='position:fixed;top:0;left:0;right:0;height:0;background:var(--bg);'+
                  'z-index:29;pointer-events:none';
 document.body.appendChild(kr);
 /* Где панель стоит, когда её не прилепило. Просто offsetTop не годится:
    у прилипшей панели он показывает уже сдвинутое положение. Поэтому на один
    кадр отключаем прилипание, меряем и возвращаем обратно — на экране это не
    видно, браузер не успевает перерисовать. Меряем редко и запоминаем. */
 var svoe=null;
 function pereizmerit(){
  var bylo=bar.style.position;
  bar.style.position='static';
  svoe=bar.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0);
  bar.style.position=bylo;
 }
 function obnovit(){
  if(svoe===null)pereizmerit();
  var t=bar.getBoundingClientRect().top;
  var sy=window.pageYOffset||document.documentElement.scrollTop||0;
  var prilipla=sy>(svoe-t+1);
  kr.style.height=(prilipla&&t>0.5)?(Math.ceil(t)+'px'):'0px';
 }
 function zanovo(){svoe=null;obnovit()}
 obnovit();
 addEventListener('scroll',obnovit,{passive:true});
 addEventListener('resize',zanovo);
 addEventListener('orientationchange',function(){setTimeout(zanovo,350)});
 if(window.visualViewport){visualViewport.addEventListener('resize',obnovit);
                           visualViewport.addEventListener('scroll',obnovit)}
 setTimeout(zanovo,700);

 /* Если к адресу дописать ?otladka=1 — панель покажет замеры.
    Нужно только чтобы разобраться, если на каком-то телефоне поедет вёрстка. */
 if(/otladka/.test(location.search)){
  var pr=document.createElement('div');
  pr.style.cssText='position:fixed;top:0;left:0;width:0;padding-top:env(safe-area-inset-top);visibility:hidden';
  document.body.appendChild(pr);
  var vyrez=Math.round(parseFloat(getComputedStyle(pr).paddingTop))||0;
  var d=document.createElement('div');
  d.style.cssText='font-size:10px;line-height:1.35;color:var(--muted);margin-top:6px';
  bar.appendChild(d);
  var pokazat=function(){
   var r=bar.getBoundingClientRect(), vv=window.visualViewport;
   d.textContent='вырез '+vyrez+' · панель сверху '+Math.round(r.top)+
     ' · своё место '+Math.round(svoe)+' · прокрутка '+Math.round(window.pageYOffset||0)+
     ' · заглушка '+kr.style.height+' · окно '+window.innerHeight+
     (vv?' · видимое '+Math.round(vv.height)+' смещение '+Math.round(vv.offsetTop):'');
  };
  pokazat();
  addEventListener('scroll',pokazat,{passive:true});
  addEventListener('resize',pokazat);
  if(window.visualViewport){visualViewport.addEventListener('resize',pokazat);
                            visualViewport.addEventListener('scroll',pokazat)}
 }
})();
</script></body></html>
